name: Build unluac Windows ARM64 Native Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win-arm64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'

      - name: Build Native Executable for Windows ARM64
        shell: cmd
        run: |
          native-image --target=windows-aarch64 -jar unluac.jar -o unluac-win-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unluac-win-arm64
          path: unluac-win-arm64.exe
