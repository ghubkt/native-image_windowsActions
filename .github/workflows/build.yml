name: Build unluac ARM64 DLL via Liberica NIK

on: [push, workflow_dispatch]

jobs:
  build-arm64-dll:
    runs-on: windows-arm64 # 使用 ARM64 宿主

    steps:
      - uses: actions/checkout@v4

      - name: Setup Liberica NIK (ARM64)
        uses: bell-sw/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'liberica-nik'

      - name: Compile to Native Shared Library (DLL)
        shell: cmd
        run: |
          native-image --shared -jar unluac.jar -o unluac-arm64

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unluac-arm64-dll
          path: |
            unluac-arm64.dll
            unluac-arm64.lib
