name: Build unluac Windows ARM64 Native Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win-arm64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download unluac.jar (Follow Redirects)
        shell: powershell
        run: |
          # 加上 -MaximumRedirection 确保跟随 SourceForge 的 CDN 跳转
          Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/unluac/unluac_2023_07_04.jar" -OutFile "unluac.jar" -UserAgent "Mozilla/5.0"
          
          # 验证文件大小（如果小于 10KB 说明依然下错了 HTML 网页）
          $fileSize = (Get-Item unluac.jar).Length
          Write-Host "Downloaded file size: $fileSize bytes"
          if ($fileSize -lt 10000) {
            throw "Downloaded file is too small, likely an HTML redirect page."
          }

      - name: Build Native Executable for Windows ARM64
        shell: cmd
        run: |
          native-image --target=windows-aarch64 -jar unluac.jar -o unluac-win-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unluac-win-arm64
          path: unluac-win-arm64.exe
