name: Build Windows ARM64 Native Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发构建

jobs:
  build-win-arm64:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Build Native Executable for Windows ARM64
        run: |
          native-image --target=windows-aarch64 -jar unluac_2025_12_23.jar -o unluac-win_arm64

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unluac-win_arm64
          path: unluac-win_arm64.exe
